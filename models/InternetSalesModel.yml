unique_name: InternetSalesModel
object_type: model
label: InternetSalesModel
metrics:
  - unique_name: m_fact_internet_sales_order_quantity_sum
  - unique_name: m_fact_internet_sales_customer_key_dc
relationships:
  - unique_name: fact_internet_sales_order_date_key_to_jdate_jdate_day
    from:
      dataset: fact_internet_sales
      join_columns:
        - order_date_key
    to:
      dimension: jdate
      level: jdate_day
  - unique_name: fact_internet_sales_customer_key_to_customer_customername
    from:
      dataset: fact_internet_sales
      join_columns:
        - customer_key
    to:
      dimension: customer
      level: customername
